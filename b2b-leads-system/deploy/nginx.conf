# Nginx 反向代理配置 —— 把域名请求转发到 Docker 里跑着的应用(127.0.0.1:8000)
#
# 使用步骤：
# 1. 把这个文件传到服务器，改名保存到 /etc/nginx/sites-available/b2b-leads
# 2. 把下面的 your-domain.com 替换成你自己的真实域名（域名需要先在DNS里把A记录指向服务器公网IP）
# 3. 建立软链接启用配置：
#      ln -s /etc/nginx/sites-available/b2b-leads /etc/nginx/sites-enabled/
# 4. 测试配置语法：nginx -t
# 5. 重载：systemctl reload nginx
# 6. 申请HTTPS证书（会自动改写这个文件，把http自动跳转https配置好）：
#      certbot --nginx -d your-domain.com
#
# 如果你没有域名，只想用IP访问，把下面的 server_name 改成 "_" 然后跳过HTTPS部分即可，
# 但不建议长期这样用——没有HTTPS，你的SerpAPI/Anthropic密钥输入等操作在传输中是明文的。

server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 20M;  # 允许上传/导出稍大的文件（比如批量导出的Excel）

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 搜索任务是后台长任务，但接口本身是异步立即返回的，
        # 这里给一个宽松的超时，防止导出大文件Excel时被Nginx提前掐断
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;  # 健康检查请求不写入访问日志，避免日志被刷屏
    }
}
