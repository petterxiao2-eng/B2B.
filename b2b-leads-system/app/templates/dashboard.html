<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>跨境B2B客户增长系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background:#f6f7fb; }
  .grade-A { background:#dcfce7; color:#166534; }
  .grade-B { background:#dbeafe; color:#1e40af; }
  .grade-C { background:#fef9c3; color:#854d0e; }
  .grade-D { background:#fee2e2; color:#991b1b; }
  .grade-unscored { background:#e5e7eb; color:#374151; }
</style>
</head>
<body class="text-sm text-gray-800">

<div class="flex h-screen overflow-hidden">
  <!-- 侧边栏：项目列表 -->
  <div class="w-64 bg-white border-r overflow-y-auto flex-shrink-0">
    <div class="p-4 border-b">
      <h1 class="font-bold text-lg">B2B客户增长系统</h1>
      <button onclick="showNewProjectForm()" class="mt-2 w-full bg-blue-600 text-white rounded py-1.5 text-sm hover:bg-blue-700">+ 新建项目</button>
    </div>
    <div id="projectList" class="p-2"></div>
  </div>

  <!-- 主内容区 -->
  <div class="flex-1 overflow-y-auto p-6" id="mainContent">
    <div class="text-gray-400 mt-20 text-center">请选择或创建一个项目</div>
  </div>
</div>

<!-- 新建项目弹窗 -->
<div id="newProjectModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 w-96">
    <h2 class="font-bold mb-3">新建项目</h2>
    <input id="npName" placeholder="项目名称，如：LED灯具-中东市场" class="border rounded w-full p-2 mb-2">
    <textarea id="npDesc" placeholder="项目描述（可选）" class="border rounded w-full p-2 mb-2"></textarea>
    <input id="npRegions" placeholder="目标地区代码，逗号分隔，如 SA,AE,UZ,KE,NG,PH,VN" class="border rounded w-full p-2 mb-3">
    <div class="flex justify-end gap-2">
      <button onclick="closeNewProjectForm()" class="px-3 py-1.5 rounded border">取消</button>
      <button onclick="createProject()" class="px-3 py-1.5 rounded bg-blue-600 text-white">创建</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
